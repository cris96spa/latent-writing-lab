name: Validate article workspace
description: Check content, formatting, documentation, build and browser interactions.
inputs:
  node-version:
    description: Node.js version to validate
    required: true
runs:
  using: composite
  steps:
    - name: Set up Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Install dependencies
      run: npm ci
      shell: bash
    - name: Verify content, formatting and build
      run: npm run check
      shell: bash
    - name: Check documentation links
      run: npm run docs:check
      shell: bash
    - name: Build the interactive guide
      run: npm run docs:build
      shell: bash
    - name: Install Chromium
      run: npx playwright install --with-deps chromium
      shell: bash
    - name: Test browser interactions
      run: npm run test:e2e
      shell: bash
