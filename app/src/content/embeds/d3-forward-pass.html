          rt + rh * l.candidateCount + 16,
          tokenLabel(token.text, l.maxTokenChars),
          c.strong,
          l.tokenSize,
          "middle",
          {
            class: "fp-falling",
            style: `--fp-distance:${l.laneY - (rt + rh * l.candidateCount + 16)}px;animation:fp-emit 200ms linear forwards`,
          },
        ),
      );
      const end = cx(l.context),
        start = cx(l.logits);
      add("path", "loop", {
        d: `M ${start} ${l.laneY} H ${end + 24} Q ${end} ${l.laneY} ${end} ${l.laneY - 24} V ${panelBottom(l) + 12}`,
        fill: "none",
        stroke: c.blue,
        "stroke-width": 1.5,
        "stroke-dasharray": "4 6",
        "marker-end": `url(#${markerId})`,
        opacity: frame.emittedTokens.length ? 0.95 : 0.3,
        style: "animation:fp-flow .9s linear infinite",
      });
      text(
        "loop-label",
        (start + end) / 2,
        l.laneY - 10,
        l.verbose ? "autoregressive · the sampled token becomes the next input" : "autoregressive",
      );
      line("detokenize", start, l.laneY, start, l.height - 26, c.brand, {
        "stroke-width": 1.5,
        "marker-end": `url(#${markerId})`,
        opacity: frame.emittedTokens.length ? 1 : 0.3,
      });
      text("detokenize-label", start, l.height - 8, "detokenize", c.strong);
      svg
        .select(".fp-scene")
        .selectAll(".fp-mark")
        .data(items, (d) => d.key)
        .join(
          (enter) =>
            enter
              .append((d) => document.createElementNS("http://www.w3.org/2000/svg", d.tag))
              .attr("class", "fp-mark"),
          (update) => update,
          (exit) => exit.remove(),
        )
        .each(function (d) {
          for (const name of this._fpAttrs ?? [])
            if (!(name in d.attrs)) this.removeAttribute(name);
          this._fpAttrs = Object.keys(d.attrs);
          for (const [name, value] of Object.entries(d.attrs))
            this.setAttribute(name, String(value));
          // Upstream figure styles set text fills, so source colors are applied explicitly.
          if (d.attrs.fill !== undefined) this.style.fill = d.attrs.fill;
          if (d.attrs.stroke !== undefined) this.style.stroke = d.attrs.stroke;
          if (d.tag === "text") this.textContent = d.text;
          if (d.tooltip) this.dataset.tooltip = d.tooltip;
          else delete this.dataset.tooltip;
          this.classList.add("fp-mark");
        })
        .order();
    }

    async function mount(container) {
      if (container.dataset.mounted) return;
      container.dataset.mounted = "loading";
      try {
        const response = await fetch("/data/forward-pass/tokens.json");
        if (!response.ok) throw new Error("Token data could not be loaded");
        const data = await response.json();
        for (const key of ["prompt", "output"])
          if (data[key + "Tokenization"].tokens.map((t) => t.text).join("") !== data[key])
            throw new Error("Token data is not lossless");
        const input = data.promptTokenization.tokens.map((t, index) => ({ ...t, index })),
          output = data.outputTokenization.tokens.map((t, index) => ({ ...t, index }));
        const frames = buildForwardPassFrames(input, output),
          last = frames.length - 1;
        const motion = matchMedia("(prefers-reduced-motion: reduce)");
        const config = JSON.parse(container.closest("[data-config]")?.dataset.config || "{}");
        const autoplay = config.autoplay !== false && !motion.matches;
        let position = autoplay ? 0 : last,
          playing = autoplay,
          view = "text",
          highlight = true,
          timer = null,
          inView = false,
          printState = null;
        const instance = "fp-" + crypto.randomUUID(),
          markerId = instance + "-arrow";
        container.style.position = "relative";
        container.innerHTML = `<div class="fp-eyebrow"><a href="https://huggingface.co/openai-community/gpt2" target="_blank" rel="noopener noreferrer">GPT-2 · 124M</a> · GREEDY DECODING</div>
        <h2 class="fp-heading">Who is <span>Cristian</span>?</h2>
        <div class="fp-card">
          <div class="fp-prompt-wrap"><div class="fp-prompt"><div class="fp-between"><span class="fp-kicker">prompt</span><fieldset class="fp-view"><legend class="fp-sr">Prompt token view</legend><label><input class="fp-radio" type="radio" name="${instance}-view" value="text" checked>text</label><label><input class="fp-radio" type="radio" name="${instance}-view" value="ids">ids</label></fieldset></div><span class="fp-prompt-tokens" aria-hidden="true"></span><p class="fp-counts"></p><p class="fp-sr">Who is Cristian?</p></div></div>
          <div class="fp-strip fp-between" aria-hidden="true"><span class="fp-status"><span class="fp-dot"></span><span class="fp-phase"></span></span><span class="fp-cache"></span></div>
          <div class="fp-diagram"><svg role="img" aria-label="GPT-2 forward pass: context embeddings, layer norms, four illustrative attention heads, residual connections, GELU MLP and next-token candidates."><defs><marker id="${markerId}" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--fp-brand)"></path></marker></defs><g class="fp-scene"></g></svg></div>
          <div class="fp-controls"><div class="fp-buttons"><button type="button" data-action="play">Pause</button><button type="button" data-action="previous" aria-label="Previous frame">◀ Step</button><button type="button" data-action="next" aria-label="Next frame">Step ▶</button><button type="button" data-action="skip">Skip to end</button><button type="button" data-action="restart">Restart</button><span class="fp-position"></span></div><label class="fp-scrub"><span class="fp-sr">Scrub the forward pass, frame by frame</span><input type="range" min="0" max="${last}" value="${position}"></label><p class="fp-caption" aria-live="polite"></p></div>
          <div class="fp-output"><div class="fp-output-head fp-between"><span>output</span><span class="fp-output-counts"></span></div><div class="fp-bio"><span class="fp-bio-sizer" aria-hidden="true"></span><span class="fp-bio-tokens" aria-hidden="true"></span></div><div class="fp-output-footer"><button type="button" class="fp-highlight" aria-label="Highlight output tokens" aria-pressed="true">highlight</button></div><p class="fp-accessible-bio fp-sr"></p></div>
        </div>
        <div class="fp-legend"><strong>Legend</strong><span><i style="background:var(--fp-blue)"></i>Embeddings / residual stream</span><span><i style="background:var(--fp-amber)"></i>Attention heads</span><span><i style="background:var(--fp-violet)"></i>MLP activations</span></div>
        <p class="fp-note">Scripted illustration from Latent Space, not a live model run. Token IDs are a captured GPT-2 tokenization of the fixed prompt and biography; attention, activations and candidate scores are illustrative and normalized over a five-token shortlist. Four of twelve heads and a trailing context window are drawn.</p><div class="fp-tooltip" role="tooltip" hidden></div>`;
        const $ = (selector) => container.querySelector(selector),
          svg = window.d3.select($("svg"));
        $(".fp-bio-sizer").textContent = data.output;
        $(".fp-accessible-bio").textContent = data.output;
        $(".fp-counts").textContent =
          `${data.promptTokenization.token_count} tokens · ${data.promptTokenization.word_count} words · ${data.promptTokenization.char_count} chars`;
        function tokens(target, list, fresh = 0) {
          const groups = groupTokensByGrapheme(list),
            fragment = document.createDocumentFragment();
          groups.forEach((group, i) => {
            const span = document.createElement("span");
            span.className = "fp-token" + (i >= groups.length - fresh ? " fp-fresh" : "");
            span.style.setProperty("--chip", tokenColors[i % 6]);
            span.style.setProperty(
              "--alpha",
              i % 2 ? "var(--fp-token-dark)" : "var(--fp-token-light)",
            );
            span.textContent =
              view === "ids" ? group.tokens.map((t) => t.id).join(" ") : group.text;
            if (view === "text" && group.tokens.length > 1) {
              const small = document.createElement("small");
              small.textContent = "×" + group.tokens.length;
              span.append(small);
            }
            fragment.append(span);
          });
          if (target === $(".fp-bio-tokens") && playing && position < last) {
            const cursor = document.createElement("span");
            cursor.className = "fp-cursor";
            cursor.textContent = "▍";
            fragment.append(cursor);
          }
          target.replaceChildren(fragment);
          if (view === "ids") target.scrollTop = target.scrollHeight;
        }
        function render() {
          const frame = frames[position],
            l = container.clientWidth < 768 ? COMPACT : FULL;
          container.dataset.playing = String(playing && position < last);
          container.dataset.phase = frame.phase;
          container.dataset.frame = position;
          container.dataset.view = view;
          container.dataset.highlight = String(highlight);
          $(".fp-phase").textContent =
            frame.phase + (frame.activeStage ? " · " + frame.activeStage : "");
          $(".fp-cache").textContent =
            `kv cache ${frame.kvCacheLength}/1024` + (l.verbose ? " ctx · 12 blocks" : "");
          $(".fp-position").textContent =
            `frame ${position} / ${last} · phase ${frame.phase} · step ${frame.step}`;
          $(".fp-caption").textContent = `${frame.phase}: ${captions[frame.phase]}`;
          $('[data-action="play"]').textContent = playing && position < last ? "Pause" : "Play";
          $('[data-action="previous"]').disabled = position === 0;
          $('[data-action="next"]').disabled = position === last;
          $('[data-action="skip"]').disabled = position === last;
          $(".fp-scrub input").value = position;
          const emitted = frame.emittedTokens.map((t) => t.text).join("");
          $(".fp-output-counts").textContent = frame.emittedTokens.length
            ? `${frame.emittedTokens.length} tokens · ${emitted.split(/\s+/).filter(Boolean).length} words · ${[...emitted].length} chars`
            : "";
          draw(svg, frame, l, markerId);
          tokens($(".fp-prompt-tokens"), input);
          tokens($(".fp-bio-tokens"), frame.emittedTokens, 2);
        }
        function schedule() {
          clearTimeout(timer);
          if (playing && position < last && inView && !document.hidden)
            timer = setTimeout(() => {
              position++;
              if (position === last) playing = false;
              render();
              schedule();
            }, frameDelayMs(frames[position]));
        }
        function seek(value) {
          playing = false;
          position = Math.max(0, Math.min(last, Math.round(value)));
          render();
          schedule();
        }
        $(".fp-scrub input").addEventListener("input", (e) => seek(Number(e.target.value)));
        $(".fp-buttons").addEventListener("click", (e) => {
          const action = e.target.closest("button")?.dataset.action;
          if (!action) return;
          if (action === "previous") return seek(position - 1);
          if (action === "next") return seek(position + 1);
          if (action === "skip") return seek(last);
          if (action === "restart") {
            position = 0;
            playing = !motion.matches;
          }
          if (action === "play") {
            if (position === last) position = 0;
            playing = !playing;
          }
          render();
          schedule();
        });
        $(".fp-view").addEventListener("change", (e) => {
          view = e.target.value;
          render();
        });
        $(".fp-highlight").addEventListener("click", () => {
          highlight = !highlight;
          $(".fp-highlight").setAttribute("aria-pressed", String(highlight));
          render();
        });
        const tooltip = $(".fp-tooltip");
        svg
          .on("pointermove", (e) => {
            const target = e.target.closest("[data-tooltip]");
            if (!target) {
              tooltip.hidden = true;
              return;
            }
            tooltip.textContent = target.dataset.tooltip;
            tooltip.hidden = false;
            const bounds = container.getBoundingClientRect();
            tooltip.style.left =
              Math.max(0, Math.min(container.clientWidth - 280, e.clientX - bounds.left + 12)) +
              "px";
            tooltip.style.top = e.clientY - bounds.top + 16 + "px";
          })
          .on("pointerleave", () => {
            tooltip.hidden = true;
          });
        const resize = new ResizeObserver(render);
        resize.observe(container);
        const visibility = new IntersectionObserver((entries) => {
          inView = entries[0].isIntersecting;
          schedule();
        });
        visibility.observe(container);
        const onVisibility = () => schedule();
        document.addEventListener("visibilitychange", onVisibility);
        const onMotion = () => {
          if (motion.matches) seek(last);
        };
        motion.addEventListener("change", onMotion);
        const beforePrint = () => {
          printState = { position, playing, view, highlight };
          playing = false;
          position = last;
          view = "text";
          render();
          schedule();
        };
        const afterPrint = () => {
          if (!printState) return;
          ({ position, playing, view, highlight } = printState);
          printState = null;
          render();
          schedule();
        };
        window.addEventListener("beforeprint", beforePrint);
        window.addEventListener("afterprint", afterPrint);
        window.addEventListener(
          "pagehide",
          () => {
            clearTimeout(timer);
            resize.disconnect();
            visibility.disconnect();
            document.removeEventListener("visibilitychange", onVisibility);
            motion.removeEventListener("change", onMotion);
            window.removeEventListener("beforeprint", beforePrint);
            window.removeEventListener("afterprint", afterPrint);
          },
          { once: true },
        );
        container.dataset.mounted = "true";
        render();
        schedule();
      } catch (error) {
        container.dataset.mounted = "error";
        const message = document.createElement("p");
        message.setAttribute("role", "alert");
        message.textContent = "The forward-pass illustration could not load. " + error.message;
        container.append(message);
      }
    }
    const start = () => document.querySelectorAll(".d3-forward-pass").forEach(mount);
    if (window.d3?.select) start();
    else {
      let loader = document.getElementById("d3-cdn-script");
      if (!loader) {
        loader = document.createElement("script");
        loader.id = "d3-cdn-script";
        loader.src = "https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js";
        document.head.append(loader);
      }
      loader.addEventListener(
        "load",
        () => {
          if (window.d3?.select) start();
        },
        { once: true },
      );
    }
  })();
</script>
